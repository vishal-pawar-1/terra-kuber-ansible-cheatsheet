apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: <namespace-name>

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: <image-name>
          ports:
            - containerPort: 5000

          env:
            - name: MYSQL_HOST
              value: mysql-service

            - name: MYSQL_PORT
              value: "3306"

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
