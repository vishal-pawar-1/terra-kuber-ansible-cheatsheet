apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: <namespace-name>

spec:
  replicas: 3

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: <image-name>

          ports:
            - containerPort: 8080