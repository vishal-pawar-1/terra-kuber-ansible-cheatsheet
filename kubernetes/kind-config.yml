kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
  - role: worker
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      
      - containerPort: 30000
        hostPort: 3000
        protocol: TCP


# kind create cluster --name <cluster-name> --config kind-config.yml