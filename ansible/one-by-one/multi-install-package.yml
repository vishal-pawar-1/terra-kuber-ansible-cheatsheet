- name: install packages
  hosts: servers
  become: yes # apt install without sudo

  vars: 
    packages:
      - git
      - curl
      - vim


  tasks:
    - name: install packages
      apt:
        name: "{{ item }}"
        state: present
      loop: "{{ packages }}"
      debug:
        msg: "Installing package {{ item }}"


